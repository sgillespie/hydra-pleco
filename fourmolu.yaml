indentation: 2
function-arrows: leading
comma-style: trailing
import-export-style: trailing
indent-wheres: true
record-brace-space: true
newlines-between-decls: 1
haddock-style: single-line
haddock-style-module: multi-line
let-style: inline
in-style: left-align
respectful: true
fixities:
  # Lenses
  - "infixl 1 &"
  - "infixl 9 %"
  - "infixr 4 .~, ?~, %~"
  - "infixl 8 ^."
  # Rel8
  - "infixr 3 &&."
  - "infixr 4 ==."
  # Servant
  - "infixl 0 :-"
  - "infixr 4 :>"
  # Prettyprinter
  - "infixr 6 <+>"
unicode: never
